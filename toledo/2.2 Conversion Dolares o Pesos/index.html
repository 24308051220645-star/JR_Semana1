<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesos a Dólares</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.card{
width:350px;
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:20px;
text-align:center;
color:white;
backdrop-filter:blur(10px);
}

.logo{
width:120px;
margin-bottom:10px;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
background:#00e5ff;
font-weight:bold;
cursor:pointer;
}

#resultado{
margin-top:20px;
font-size:24px;
color:#00ff9d;
}

</style>
</head>

<body>

<div class="card">

<img src="images/dolar.png" class="logo">

<h1>Pesos a Dólares</h1>

<input type="number" id="pesos" placeholder="Pesos mexicanos">

<input type="number" id="cambio" placeholder="Tipo de cambio">

<button onclick="calcular()">
Convertir
</button>

<div id="resultado"></div>

</div>

<script>

function calcular(){

let pesos =
parseFloat(document.getElementById("pesos").value);

let cambio =
parseFloat(document.getElementById("cambio").value);

let dolares = pesos / cambio;

document.getElementById("resultado").innerHTML =
"$" + dolares.toFixed(2);

}

</script>

</body>
</html>
