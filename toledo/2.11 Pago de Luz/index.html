<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Pago de Luz</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#f7971e,#ffd200);
}

.card{
width:350px;
background:white;
padding:30px;
border-radius:20px;
text-align:center;
}

.logo{
width:120px;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
box-sizing:border-box;
}

button{
background:#f7971e;
color:white;
font-weight:bold;
}

#resultado{
margin-top:20px;
font-size:24px;
color:#f7971e;
}

</style>
</head>

<body>

<div class="card">

<img src="images/luz.png" class="logo">

<h1>Pago de Luz</h1>

<input type="number" id="kw" placeholder="Kilowatts">

<input type="number" id="precio" placeholder="Costo por KW">

<button onclick="calcular()">
Calcular
</button>

<div id="resultado"></div>

</div>

<script>

function calcular(){

let kw =
parseFloat(document.getElementById("kw").value);

let precio =
parseFloat(document.getElementById("precio").value);

let total = kw * precio;

document.getElementById("resultado").innerHTML =
"$" + total.toFixed(2);

}

</script>

</body>
</html>
