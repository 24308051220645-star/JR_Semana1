<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Hipotenusa</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#134e5e,#71b280);
}

.card{
width:350px;
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:20px;
text-align:center;
color:white;
}

.logo{
width:120px;
margin-bottom:10px;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}

button{
background:#00e5ff;
font-weight:bold;
}

#resultado{
margin-top:20px;
font-size:24px;
color:#00ff9d;
}

</style>
</head>

<body>

<div class="card">

<img src="images/hipotenusa.png" class="logo">

<h1>Hipotenusa</h1>

<input type="number" id="a" placeholder="Lado A">

<input type="number" id="b" placeholder="Lado B">

<button onclick="calcular()">
Calcular
</button>

<div id="resultado"></div>

</div>

<script>

function calcular(){

let a =
parseFloat(document.getElementById("a").value);

let b =
parseFloat(document.getElementById("b").value);

let c = Math.sqrt((a*a)+(b*b));

document.getElementById("resultado").innerHTML =
c.toFixed(2);

}

</script>

</body>
</html>
